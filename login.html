<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Centralized Alumni Data Management and Engagement</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="auth-container">
        <!-- Floating glass background glow circles -->
        <div class="background-glows">
            <div class="glow-circle glow-1"></div>
            <div class="glow-circle glow-2"></div>
            <div class="glow-circle glow-3"></div>
        </div>

        <a href="index.html" class="back-to-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="auth-card glass-card">
            <div class="auth-header">
                <div class="auth-logo">AlumniHub</div>
                <div class="auth-subtitle">Centralized Alumni Data & Engagement Platform</div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">College Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@college.edu" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary mt-2">
                    <i class="fas fa-sign-in-alt"></i> Login to Portal
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create an Account</a>
                <div class="mt-4" style="font-size: 0.8rem; opacity: 0.7;">
                    <strong>Demo Admin:</strong> admin@college.edu / admin<br>
                    <strong>Demo User:</strong> user@college.edu / user123
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
